name: Deploy Playground

on:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "src/**"
      - "resources/**"
      - "rollup.config.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-playground
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Stage playground site
        run: |
          mkdir -p deploy/examples deploy/resources deploy/dist
          cp playground/index.html playground/index.js deploy/
          cp playground/examples/*.html deploy/examples/
          cp resources/* deploy/resources/
          cp dist/stickygum.min.js dist/stickygum.js deploy/dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true