name: Deploy Playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "resources/**"
      - "src/**"
      - "rollup.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-playground.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build playground
        run: npx webpack --config playground/webpack.config.js --mode production

      - name: Assemble static site
        run: |
          mkdir -p _site/examples _site/resources _site/dist
          cp -r playground/dist/. _site/
          cp -r playground/examples/. _site/examples/
          cp -r resources/. _site/resources/
          cp dist/stickygum.min.js _site/dist/

      - name: Skip Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4